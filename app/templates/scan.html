{% extends "base.html" %}
{% block title %}Приёмка · TrackBridge{% endblock %}
{% block head %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  function scanner() {
    const load = (k, d = "") => { try { return localStorage.getItem(k) ?? d } catch { return d } };
    const save = (k, v) => { try { localStorage.setItem(k, v) } catch {} };
    return {
      apiKey: load("tb.apiKey"),
      workerId: load("tb.workerId"),
      warehouseId: load("tb.warehouseId"),
      showSettings: false,
      cameraOn: false,
      camera: null,
      init() {
        this.showSettings = !this.apiKey;
        this.$watch("apiKey", v => save("tb.apiKey", v));
        this.$watch("workerId", v => save("tb.workerId", v));
        this.$watch("warehouseId", v => save("tb.warehouseId", v));
        this.$nextTick(() => this.$refs.code.focus());
      },
      headers() {
        return JSON.stringify({ "X-API-Key": this.apiKey, "X-Worker-Id": this.workerId });
      },
      afterSubmit(event) {
        if (event.detail.successful) {
          this.$refs.form.reset();
          if (navigator.vibrate) navigator.vibrate(60);
        } else if (navigator.vibrate) {
          navigator.vibrate([80, 60, 80]);
        }
        this.$refs.code.focus();
      },
      async toggleCamera() {
        if (this.cameraOn) return this.stopCamera();
        this.cameraOn = true;
        await this.$nextTick();
        this.camera = new Html5Qrcode("reader");
        try {
          await this.camera.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 260, height: 160 } },
            text => { this.$refs.code.value = text; this.stopCamera(); this.$refs.weight.focus(); }
          );
        } catch (err) {
          this.cameraOn = false;
          alert("Камера недоступна (нужен HTTPS и разрешение): " + err);
        }
      },
      async stopCamera() {
        if (this.camera) { try { await this.camera.stop() } catch {} this.camera.clear(); this.camera = null; }
        this.cameraOn = false;
      },
    };
  }
</script>
{% endblock %}

{% block body %}
<main x-data="scanner()" class="mx-auto max-w-md px-4 pb-10" style="padding-top: max(1rem, env(safe-area-inset-top))">
  <header class="mb-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold">Приёмка груза</h1>
      <p class="text-xs text-slate-500">收货扫描 · <span x-text="workerId || 'без ID'"></span></p>
    </div>
    <button type="button" @click="showSettings = !showSettings"
            class="rounded-lg bg-white px-3 py-2 text-lg shadow-sm" aria-label="Настройки">⚙️</button>
  </header>

  <section x-show="showSettings" x-cloak class="mb-4 space-y-3 rounded-xl bg-white p-4 shadow-sm">
    <label class="block text-sm font-medium">API-ключ / API Key
      <input x-model="apiKey" type="password" autocomplete="off"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </label>
    <label class="block text-sm font-medium">ID сотрудника / 工号
      <input x-model="workerId" type="text" maxlength="100"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </label>
    <label class="block text-sm font-medium">Склад / 仓库
      <select x-model="warehouseId" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2">
        <option value="">— не менять —</option>
        {% for w in warehouses %}
        <option value="{{ w.id }}">{{ w.name }}{% if w.location %} ({{ w.location }}){% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <button type="button" @click="showSettings = false"
            class="w-full rounded-lg bg-slate-900 py-2 font-medium text-white">Готово</button>
  </section>

  <form x-ref="form" hx-post="/warehouse/scan" hx-target="#results" hx-swap="afterbegin"
        :hx-headers="headers()" @htmx:after-request="afterSubmit($event)"
        hx-disabled-elt="find button[type=submit]"
        class="space-y-3 rounded-xl bg-white p-4 shadow-sm">
    <input type="hidden" name="warehouse_id" :value="warehouseId">

    <label class="block text-sm font-medium">Трек-код / 快递单号
      <div class="mt-1 flex gap-2">
        <input x-ref="code" name="tracking_code" required autocomplete="off" autocapitalize="characters"
               inputmode="text" enterkeyhint="next" placeholder="Сканируйте или введите"
               @keydown.enter.prevent="$refs.weight.focus()"
               class="w-full rounded-lg border border-slate-300 px-3 py-3 font-mono text-lg uppercase">
        <button type="button" @click="toggleCamera()"
                class="shrink-0 rounded-lg px-4 text-xl"
                :class="cameraOn ? 'bg-red-100' : 'bg-slate-100'" aria-label="Камера">📷</button>
      </div>
    </label>

    <div x-show="cameraOn" x-cloak id="reader" class="overflow-hidden rounded-lg"></div>

    <div class="grid grid-cols-2 gap-3">
      <label class="block text-sm font-medium">Вес, кг / 重量
        <input x-ref="weight" name="weight_kg" type="number" step="0.01" min="0" inputmode="decimal"
               enterkeyhint="send" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-lg">
      </label>
      <label class="block text-sm font-medium">Объём, м³ / 体积
        <input name="volume_cbm" type="number" step="0.001" min="0" inputmode="decimal"
               enterkeyhint="send" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-lg">
      </label>
    </div>

    <button type="submit"
            class="w-full rounded-lg bg-emerald-600 py-3 text-lg font-semibold text-white active:bg-emerald-700 disabled:opacity-50">
      Принять / 确认收货
    </button>
  </form>

  <section id="results" class="mt-4 space-y-2" aria-live="polite"></section>
</main>
<style>[x-cloak]{display:none!important}</style>
{% endblock %}
