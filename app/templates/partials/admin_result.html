{% if error %}
<article class="rounded-xl border-l-4 border-red-500 bg-red-50 p-3 text-sm">
  <p class="font-semibold text-red-800">✗ Не зарегистрировано</p>
  <p class="text-red-700">{{ error }}</p>
</article>
{% else %}
<article class="rounded-xl border-l-4 border-emerald-500 bg-emerald-50 p-3 text-sm">
  <p class="font-semibold text-emerald-800">✓ Зарегистрирована: <span class="font-mono">{{ parcel.tracking_code }}</span></p>
  <p class="text-slate-700">{{ parcel.client_name }} · {{ parcel.client_phone }}</p>
</article>
{% endif %}
