{% if error %}
<p class="mb-2 rounded-xl bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
{% endif %}
{% if not warehouses %}
<p class="text-sm text-slate-500">Складов пока нет.</p>
{% else %}
<ul class="divide-y divide-slate-100 text-sm">
  {% for w in warehouses %}
  <li x-data="{ editing: false }" class="py-2">
    <div x-show="!editing" class="flex items-center justify-between gap-2">
      <span class="min-w-0 truncate"><span class="font-medium">{{ w.name }}</span>{% if w.location %} <span class="text-slate-500">· {{ w.location }}</span>{% endif %}</span>
      <span class="flex shrink-0 gap-1">
        <button type="button" @click="editing = true"
                class="rounded-lg bg-slate-100 px-2 py-1 text-xs font-medium active:bg-slate-200">Изменить</button>
        <button type="button"
                hx-post="/admin/warehouses/{{ w.id }}/delete" hx-target="#warehouses" hx-headers="js:tbHeaders()"
                hx-confirm="Удалить склад «{{ w.name }}»?" hx-disabled-elt="this"
                class="rounded-lg bg-red-50 px-2 py-1 text-xs font-medium text-red-700 active:bg-red-100 disabled:opacity-50">Удалить</button>
      </span>
    </div>
    <form x-show="editing" x-cloak
          hx-post="/admin/warehouses/{{ w.id }}" hx-target="#warehouses" hx-headers="js:tbHeaders()"
          hx-disabled-elt="find button[type=submit]"
          class="grid gap-2 sm:grid-cols-[1fr_1fr_auto_auto] sm:items-center">
      <input name="name" value="{{ w.name }}" required maxlength="200" autocomplete="off" aria-label="Название"
             class="w-full rounded-lg border border-slate-300 px-3 py-1.5">
      <input name="location" value="{{ w.location }}" maxlength="300" autocomplete="off" aria-label="Расположение"
             class="w-full rounded-lg border border-slate-300 px-3 py-1.5">
      <button type="submit"
              class="rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white active:bg-slate-700 disabled:opacity-50">Сохранить</button>
      <button type="button" @click="editing = false"
              class="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-medium active:bg-slate-200">Отмена</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endif %}
